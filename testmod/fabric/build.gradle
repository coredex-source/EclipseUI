plugins {
    id 'net.fabricmc.fabric-loom-remap' version "$fabric_loom_version"
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://maven.terraformersmc.com/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_api_version')}"

    // ModMenu integration
    modImplementation "com.terraformersmc:modmenu:${property('modmenu_version')}"

    // Exercise the actual remapped library built by the parent project.
    modImplementation files(rootProject.file("../bin/EclipseUI-fabric-${property('eclipseUiVersion')}-fabric-${property('minecraft_version')}.jar"))
}

loom {
    runs {
        client {
            client()
            configName = 'TestMod Fabric Client'
            ideConfigGenerated true
        }
    }
}

tasks.named('processResources') {
    def modVersion = project.property('mod_version').toString()
    def minecraftVersion = project.property('minecraft_version').toString()
    def fabricLoaderVersion = project.property('fabric_loader_version').toString()

    inputs.property 'version', modVersion
    inputs.property 'minecraft_version', minecraftVersion
    inputs.property 'fabric_loader_version', fabricLoaderVersion

    filesMatching('fabric.mod.json') {
        expand(
                version: modVersion,
                minecraft_version: minecraftVersion,
                fabric_loader_version: fabricLoaderVersion
        )
    }
}

base {
    archivesName = 'EclipseUI-TestMod-fabric'
}
